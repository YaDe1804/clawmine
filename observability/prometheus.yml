global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: openclaw
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9464"]
        labels:
          service: openclaw

  - job_name: openclaw_gateway
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["host.docker.internal:18789"]
        labels:
          service: openclaw-gateway

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
